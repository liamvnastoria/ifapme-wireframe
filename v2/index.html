<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changer d'image avec JavaScript</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="contenu">
    <h1>Changer d'image avec JavaScript</h1>

    <div class="cadre">
      <img id="image" src="images/image-a.svg" alt="Image A" width="640" height="360">
    </div>

    <div class="boutons">
      <button id="boutonA" type="button">Bouton A</button>
      <button id="boutonB" type="button">Bouton B</button>
    </div>

    <p class="legende">Le bouton A affiche l'image A, le bouton B remplace l'image par l'image B.</p>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
