<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Café Flipper</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">Café Flipper</a>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="carte.html">La carte</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact</h1>

    <form class="contact-form" action="merci.html">
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" name="prenom" placeholder="ex. Liam" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="ex. liam@ifapme.be" required>

      <label for="texte">Message</label>
      <textarea id="texte" name="texte" rows="5"></textarea>

      <button type="submit">Envoyer</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Café Flipper — Rue des Billes 42, 4000 Liège</p>
  </footer>

</body>
</html>
